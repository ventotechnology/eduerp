name: EduERP CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    name: PostgreSQL Migration, Test, Lint & Production Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: eduerp_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Validate Prisma Schema Format
        run: npx prisma format

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Prisma Database Migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: "postgresql://postgres:postgrespassword@localhost:5432/eduerp_ci_test?schema=public"
          AUTH_SECRET: "ci_pipeline_secret_test_key_32_bytes_long"
          NODE_ENV: "test"

      - name: Run Test Suite (Vitest)
        run: npm test
        env:
          DATABASE_URL: "postgresql://postgres:postgrespassword@localhost:5432/eduerp_ci_test?schema=public"
          AUTH_SECRET: "ci_pipeline_secret_test_key_32_bytes_long"
          NODE_ENV: "test"

      - name: Run ESLint
        run: npm run lint

      - name: Run Next.js Production Build
        run: npm run build
        env:
          DATABASE_URL: "postgresql://postgres:postgrespassword@localhost:5432/eduerp_ci_test?schema=public"
          AUTH_SECRET: "ci_pipeline_secret_test_key_32_bytes_long"
          NODE_ENV: "production"
