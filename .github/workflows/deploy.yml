name: EduERP Production Deployment

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release Version Tag (e.g. eduerp-owner-qa-v1)'
        required: false
        default: 'latest'

jobs:
  deploy-vps:
    name: Deploy to EduERP Hostinger VPS
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Execute Remote Zero-Downtime Deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EDUERP_VPS_HOST }}
          username: ${{ secrets.EDUERP_VPS_USER }}
          key: ${{ secrets.EDUERP_VPS_SSH_KEY }}
          port: ${{ secrets.EDUERP_VPS_PORT || 22 }}
          script: |
            set -e
            echo "=== Starting EduERP Production Deployment ==="
            
            cd /opt/eduerp
            
            # 1. Pull latest release code
            git fetch origin main --tags
            git reset --hard origin/main
            
            # 2. Rebuild app container
            docker compose build eduerp-app
            docker compose up -d eduerp-app
            
            # 3. Wait for container health
            sleep 5
            
            # 4. Execute production migrations
            docker compose exec -T eduerp-app npx prisma migrate deploy
            
            # 5. Verify local health check
            curl -s http://127.0.0.1:3500/api/health
            curl -s http://127.0.0.1:3500/api/ready
            
            echo "=== EduERP Deployment Completed Successfully! ==="
